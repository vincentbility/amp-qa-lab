name: Amp PR Reporter

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Amp Review Comment Relay]
    types: [completed]
  repository_dispatch:
    types: [amp-pr-report]

permissions: {}

jobs:
  report:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@amp')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_review_comment' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: amp-reporter-${{ github.event.client_payload.source_kind || github.event_name }}-${{ github.event.client_payload.comment_id || github.event.client_payload.pr_number || github.event.comment.id || github.event.workflow_run.display_title }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Never check out a PR head or its synthetic merge commit.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { reportMention } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/amp-pr-reporter.mjs`);
            const result = await reportMention({ github, context });
            core.info(JSON.stringify(result));
